name: Rust

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: fmt
      run: cargo fmt --all -- --check 
    - name: Clippy
      run: cargo clippy --all --all-targets -- -D warnings
    - name: Build
      run: cargo build --lib --verbose
    - name: Tests
      run: cargo test --lib --verbose
